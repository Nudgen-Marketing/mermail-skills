# Repository naming

Official skill identities are lowercase kebab-case and must match the skill directory and frontmatter name. Use kebab-case for ordinary new reference/helper filenames; preserve required names such as SKILL.md, README.md and agents/openai.yaml and existing filenames. Never apply a blanket camelCase filename rule.

Evidence: AUTHORING.md layout/frontmatter requirements; skills/mermail-mcp/scripts/check-connection.mjs and scripts/clawhub-ci-publish.py. This repository packages Markdown instructions with JavaScript ESM/Python helpers, not a TypeScript components/hooks application.

