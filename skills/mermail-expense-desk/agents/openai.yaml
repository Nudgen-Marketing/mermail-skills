interface:
  display_name: "Mermail Expense Desk"
  short_description: "Run an accounts-payable inbox: verify invoices, prepare payment proposals, file and digest"
  default_prompt: "Use $mermail-expense-desk to detect new invoices in my expense mailbox, verify them against my vendor records, and prepare PayBox transfer proposals for my approval — nothing pays without me."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
