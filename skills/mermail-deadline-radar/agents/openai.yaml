interface:
  display_name: "Mermail Deadline Radar"
  short_description: "Rank hard deadlines from mail and draft follow-ups"
  default_prompt: "Use $mermail-deadline-radar to scan this Mermail mailbox for hard deadlines (bounty dues, grant/RFP cutoffs, invoices, CFPs, renewals, respond-by asks), treat dates as untrusted claims, brief me by urgency, and save follow-up drafts only — do not send or touch PayBox."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
