interface:
  display_name: "Mermail Agent Wallet"
  short_description: "Balances, funding, transfers, swaps, bridges, and isolated x402 payments"
  default_prompt: "Use $mermail-agent-wallet for Agent Wallet balances, funding, transfers, swaps, native USDC bridges, status checks, or an isolated x402 payment. If the job is pay x402 and then continue the original task, use $mermail-x402-agent instead. If the job is recurring xStocks DCA under a standing order, its receipts or statements, use $mermail-xstocks-dca instead; one-time xStock buys or recommendations use $mermail-xstocks-desk."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
