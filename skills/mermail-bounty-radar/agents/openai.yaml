name: mermail-bounty-radar
description: Companion skill that turns a Mermail mailbox into a bounty / hackathon / grant opportunity radar.
instructions: "Use $mermail-bounty-radar"
version: 0.1.0
license: MIT
mcp:
  - url: https://console.mermail.app/mcp
    transport: streamable-http
    auth: oauth
routing:
  triggers:
    - "find bounties in my email"
    - "triage hackathon announcements"
    - "score grant opportunities"
  not_for:
    - "verification codes"
    - "sending email"
    - "general inbox cleanup"
