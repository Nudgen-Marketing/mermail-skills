interface:
  display_name: "Mermail Ops Agent"
  short_description: "Orchestrate daily inbox inspection, organization, and prepared email operations"
  default_prompt: "Use $mermail-ops-agent to inspect my inbox, organize what needs attention, and prepare drafts and actions for my approval."
dependencies:
