interface:
  display_name: "Mermail Language Bridge"
  short_description: "Fact-locked multilingual inbox replies"
  default_prompt: "Use $mermail-language-bridge to understand this email, preserve its facts, and draft a reply in the sender's language without sending it."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
