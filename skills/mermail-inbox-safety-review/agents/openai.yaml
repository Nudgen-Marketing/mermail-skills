interface:
  display_name: "Mermail Inbox Safety Review"
  short_description: "Review email for instructions aimed at your agent"
  default_prompt: "Use $mermail-inbox-safety-review to inspect the selected Mermail messages and give an evidence-linked safety report without changing the inbox."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
