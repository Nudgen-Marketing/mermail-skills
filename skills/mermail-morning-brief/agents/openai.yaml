interface:
  display_name: "Morning Brief"
  short_description: "Email digest of any topic feed through your Mermail inbox"
  default_prompt: "Use $mermail-morning-brief to send me a morning email digest of my topic feed"
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
