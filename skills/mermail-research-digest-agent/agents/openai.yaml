interface:
  display_name: "Mermail Research Digest Agent"
  short_description: "Cited briefings with reviewed one-time delivery"
  default_prompt: "Use $mermail-research-digest-agent to produce this week’s cited digest from my subscriptions mailbox."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
