interface:
  display_name: "Mermail Refund Follow-Through"
  short_description: "Trace one promised refund through email evidence"
  default_prompt: "Use $mermail-refund-follow-through to review one order's refund emails, show distinct processing notices and missing evidence, and leave bank credit unverified."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
