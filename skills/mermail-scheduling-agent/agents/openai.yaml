interface:
  display_name: "Mermail Scheduling Agent"
  short_description: "Prepare or book meetings from Mermail and Google Calendar"
  default_prompt: "Use $mermail-scheduling-agent when the job is preparing a read-only meeting brief from a selected scheduling thread, scheduling, checking calendar availability, offering slots, or confirming a meeting through Mermail."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
