interface:
  display_name: "Mermail Web3 Opportunity Scout"
  short_description: "Safely rank Web3 bounties and airdrop leads from a bounded Mermail inbox."
  default_prompt: "Use $mermail-opportunity-scout to triage my latest Web3 opportunity emails without sending or spending."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
