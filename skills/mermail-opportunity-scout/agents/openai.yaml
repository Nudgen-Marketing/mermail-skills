interface:
  display_name: "Mermail Opportunity Scout"
  short_description: "Find and rank opportunities from a Mermail inbox."
  default_prompt: "Use mermail-opportunity-scout to scout my Mermail inbox for opportunities matching my criteria."

dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
