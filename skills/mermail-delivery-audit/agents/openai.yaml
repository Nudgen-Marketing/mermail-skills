interface:
  display_name: "Mermail Delivery Audit"
  short_description: "Audit delivery reports without resending mail"
  default_prompt: "Use $mermail-delivery-audit to investigate the selected message's delivery reports without sending or changing anything."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
