interface:
  display_name: "Mermail AP Invoice Agent"
  short_description: "Triage vendor invoices in Mermail, draft owner briefs, optional approved PayBox prep."
  default_prompt: "Use $mermail-ap-invoice-agent to triage AP invoices in my Mermail mailbox and draft an owner brief without paying yet."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
