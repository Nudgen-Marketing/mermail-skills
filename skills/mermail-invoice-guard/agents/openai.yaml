interface:
  display_name: "Mermail Invoice Guard"
  short_description: "Human-in-the-loop vendor invoice payment from a Mermail inbox"
  default_prompt: "Use $mermail-invoice-guard to scan a Mermail inbox for vendor invoices, extract untrusted candidate fields, preview the exact payout, and pay with PayBox only after the authenticated user confirms destination, amount, asset, and chain. Stay preview-only when the user forbids sending money."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
