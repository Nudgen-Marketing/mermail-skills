interface:
  display_name: "RelayBrief for Mermail"
  short_description: "Research incoming email with evidence and review drafts"
  default_prompt: "Use $mermail-relaybrief to research this selected incoming email against bounded history, show exact evidence and sender context, and prepare a local response for my review."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
