interface:
  display_name: "Mermail Decision Gate"
  short_description: "Turn one bounded email thread into a safe, source-grounded decision packet."
  default_prompt: "Use $mermail-decision-gate to assess this bounded Mermail thread and show facts, conflicts, unknowns, and the safe next action."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
