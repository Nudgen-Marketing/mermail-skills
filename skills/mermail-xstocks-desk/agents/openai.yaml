  short_description: "Buy one verified xStock through Mermail Agent Wallet"
  default_prompt: "Use $mermail-xstocks-desk to resolve one evidence-backed product from the published catalog, then prepare one USDC-to-xStock swap with the standard Mermail Agent Wallet. Let PayBox handle review and signing, and reconcile only the same provider request."
dependencies:
