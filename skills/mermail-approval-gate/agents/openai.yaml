interface:
  display_name: "Mermail Approval Gate"
  short_description: "Proof-of-work reports and sender-bound human review gates"
  default_prompt: "Use $mermail-approval-gate to prepare an evidence report and collect a designated human's reply for a frozen action, preserving durable reservations and the owning skill's separate operator approval."
dependencies:
