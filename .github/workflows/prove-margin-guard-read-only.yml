name: Prove Margin Guard with existing Mermail messages

on:
  workflow_dispatch:
    inputs:
      resume_run_tag:
        description: "Existing synthetic self-addressed run tag; read-only replay"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test
      - name: Read two pre-existing synthetic messages and build Margin Packet
        env:
          MERMAIL_API_KEY: ${{ secrets.MERMAIL_MCP_TEST_API_KEY }}
          MERMAIL_LIVE_RESUME: "1"
          MERMAIL_LIVE_RUN_TAG: ${{ inputs.resume_run_tag }}
        run: npm run prove:live-margin
