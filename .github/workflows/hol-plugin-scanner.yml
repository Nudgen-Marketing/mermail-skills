name: Plugin Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@cc22fc7f06702f437990fa89509e0b3c1119eab6 # v1.2.523
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          format: json
          output: ${{ runner.temp }}/mermail-security-scan.json
      - name: Retain security findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mermail-security-scan
          path: ${{ runner.temp }}/mermail-security-scan.json
          if-no-files-found: warn
