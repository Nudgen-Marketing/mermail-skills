name: Plugin Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@3908ae0d692dcf97f2eaea63a89f532e19d22659 # v1.2.570
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
