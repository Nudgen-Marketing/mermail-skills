name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      live_margin_guard:
        description: "Optional live proof; round-trip sends one synthetic email back to the same test mailbox"
        required: true
        default: connection_only
        type: choice
        options:
          - connection_only
          - roundtrip_probe
          - seed_and_prove
          - resume_and_prove
      resume_run_tag:
        description: "Existing run tag for a read-only resume (for example 34372972140-1)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test
      - name: Validate production MCP contract
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          MERMAIL_MCP_TEST_API_KEY: ${{ secrets.MERMAIL_MCP_TEST_API_KEY }}
          MERMAIL_REQUIRE_TEST_API_KEY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npm run validate:remote
      - name: Run live Margin Guard proof
        if: github.event_name == 'workflow_dispatch' && inputs.live_margin_guard == 'seed_and_prove'
        env:
          MERMAIL_API_KEY: ${{ secrets.MERMAIL_MCP_TEST_API_KEY }}
          MERMAIL_LIVE_SEND_APPROVED: "1"
          MERMAIL_LIVE_RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run prove:live-margin
      - name: Run one-message Mermail round-trip probe
        if: github.event_name == 'workflow_dispatch' && inputs.live_margin_guard == 'roundtrip_probe'
        env:
          MERMAIL_API_KEY: ${{ secrets.MERMAIL_MCP_TEST_API_KEY }}
          MERMAIL_LIVE_SEND_APPROVED: "1"
          MERMAIL_LIVE_RUN_TAG: probe-${{ github.run_id }}
        run: npm run probe:live-roundtrip
      - name: Resume live Margin Guard proof without another send
        if: github.event_name == 'workflow_dispatch' && inputs.live_margin_guard == 'resume_and_prove'
        env:
          MERMAIL_API_KEY: ${{ secrets.MERMAIL_MCP_TEST_API_KEY }}
          MERMAIL_LIVE_RESUME: "1"
          MERMAIL_LIVE_RUN_TAG: ${{ inputs.resume_run_tag }}
        run: npm run prove:live-margin
